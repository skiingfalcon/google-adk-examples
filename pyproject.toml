[project]
name = "google-adk-samples"
version = "0.1.0"
description = "Comprehensive collection of Google Agent Development Kit examples and agent patterns"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a]>=1.15.1",
    "google-auth>=2.41.0",
    "google-cloud-bigquery>=3.38.0",
    "toolbox-core>=0.5.2",
    "yfinance>=0.2.66",
]

[project.optional-dependencies]
semgrep = [
    "semgrep>=1.45.0",
]
security = [
    "bandit>=1.7.5",
    "semgrep>=1.45.0",
]
